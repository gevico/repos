name: Request

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to validate
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  group: request-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  request:
    name: Preview
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
      STATE_AGE_RECIPIENT: ${{ vars.STATE_AGE_RECIPIENT }}
      STATE_GIT_NAME: ${{ vars.STATE_GIT_NAME }}
      STATE_GIT_EMAIL: ${{ vars.STATE_GIT_EMAIL }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - run: mkdir -p .work/tmp
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # v6
        if: vars.AUTOMATION_ENABLED == 'true'
        with:
          go-version: '1.26.3'
          cache: false
      - run: npm --prefix automation ci --no-fund --no-audit --ignore-scripts
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
      - run: npm --prefix automation run backend:build
        if: vars.AUTOMATION_ENABLED == 'true'
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        if: vars.AUTOMATION_ENABLED == 'true'
        id: app
        with:
          client-id: ${{ vars.READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.READ_APP_PRIVATE_KEY }}
          owner: gevico
          permission-administration: read
          permission-contents: read
          permission-members: read
      - uses: ./.github/actions/automation
        with:
          command: request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          CONTROL_TOKEN: ${{ github.token }}
          STATE_AGE_KEY: ${{ secrets.STATE_AGE_KEY }}
          TMPDIR: ${{ github.workspace }}/.work/tmp
