name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - run: mkdir -p .work/tmp
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # v6
        with:
          go-version: '1.26.3'
          cache: false
      - run: npm --prefix automation ci --no-fund --no-audit
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
      - run: npm --prefix automation run check
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
      - run: npm --prefix automation run backend:build
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
      - uses: ./.github/actions/check-artifact
        env:
          CONTROL_TOKEN: ${{ github.token }}
          TMPDIR: ${{ github.workspace }}/.work/tmp
      - run: terraform -chdir=automation/terraform fmt -check
      - run: terraform -chdir=automation/terraform init -backend=false -input=false -lockfile=readonly
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
      - run: terraform -chdir=automation/terraform validate
